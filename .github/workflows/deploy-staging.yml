name: Deploy Staging (Cloudflare)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to Cloudflare Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # ─── Etapa 1: Aplicar migrations no D1 staging (remoto) ─────
      - name: Apply D1 Migrations (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply siscr-shared-staging --remote

      # ─── Etapa 2: Deploy do Worker (API Hono) ───────────────────
      - name: Deploy API Worker (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env staging

      # ─── Etapa 2b: Ponte SEFAZ (Cloudflare Containers / mTLS) ───
      # Build da imagem no runner (Docker); runtime fica 100% na Cloudflare.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy SEFAZ bridge (Containers)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sefaz-bridge
          command: deploy
          # BRIDGE_TOKEN já existe no Worker (wrangler secret); não sobrescrever aqui.

      # ─── Etapa 3: Build do frontend ─────────────────────────────
      - name: Build Frontend
        run: pnpm --filter=@siscr/web run build
        env:
          VITE_API_URL: https://api-staging.siscr.com.br

      # ─── Etapa 4: Deploy do frontend no Cloudflare Pages ────────
      # Projeto `siscr-web` já existe; não rodar `pages project create`.
      - name: Deploy Frontend to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: pages deploy ../../apps/web/dist --project-name=siscr-web --branch=staging

      - name: Build Support desk
        run: pnpm --filter=@siscr/support run build
        env:
          VITE_API_URL: https://api-staging.siscr.com.br

      - name: Ensure Support Pages project exists
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler pages project list --json | grep -Fq '"Project Name": "siscr-support"'; then
            echo "Pages project siscr-support already exists"
          else
            pnpm exec wrangler pages project create siscr-support --production-branch=staging
          fi

      - name: Deploy Support desk to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: pages deploy ../../apps/support/dist --project-name=siscr-support --branch=staging

      - name: Summary
        run: |
          echo "## Deploy Staging Concluido!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API (Worker):** https://api-staging.siscr.com.br" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend (Pages):** https://staging.siscr.com.br" >> $GITHUB_STEP_SUMMARY
          echo "- **Suporte (Pages):** https://suporte-staging.siscr.com.br" >> $GITHUB_STEP_SUMMARY
          echo "- **Ponte SEFAZ:** https://siscr-sefaz-bridge.lucaspercisi.workers.dev" >> $GITHUB_STEP_SUMMARY
