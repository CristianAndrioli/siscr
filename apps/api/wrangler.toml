name = "siscr-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────
# Variáveis de ambiente (não-secretas)
# ──────────────────────────────────────────────
[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174"
# "1" = permitir fluxo de XML NF-e sem certificado ICP (desenvolvimento). Produção: "0"
NFE_DEV_MODE = "1"
# Limite mensal de NF-e autorizadas (homolog/staging); produção pode sobrescrever
NFE_QUOTA_MENSAL = "50"
SUPPORT_DESK_URL = "http://localhost:5174"
EMAIL_FROM = "SISCR <noreply@siscr.com.br>"
STRIPE_PRICE_BASICO = "price_1U59stJcxPm9Lx7vQkyftcVw"
STRIPE_PRICE_PRO = "price_1U59swJcxPm9Lx7vDOkPmykQ"
STRIPE_PRICE_ENTERPRISE = "price_1U59t0JcxPm9Lx7v0ADoOFfH"

# Workers AI — nano assistente de suporte
[ai]
binding = "AI"

# Cloudflare Email Service (transacional)
[[send_email]]
name = "EMAIL"

# Chat ao vivo (uma sala Durable Object por ticket)
[[durable_objects.bindings]]
name = "SUPPORT_TICKET_ROOMS"
class_name = "SupportTicketRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupportTicketRoom"]

# ──────────────────────────────────────────────
# D1 — Banco compartilhado (tenants, planos, billing)
# ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB_SHARED"
database_name = "siscr-shared-staging"
database_id = "20ed0f6a-54fd-41f4-8cf2-36032ef60da1"
migrations_dir = "../../packages/db/migrations/shared"

# ──────────────────────────────────────────────
# KV — Sessões, cache de tenant routing
# ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "7ebafa6b64e24c56abea57f8d0998c94"

[[kv_namespaces]]
binding = "KV_TENANT_CACHE"
id = "1119412c979c4f4ba0e4b4c247720c93"

# ──────────────────────────────────────────────
# R2 — Certificado A1 cifrado + XMLs NF-e (bucket_name = nome exato no painel R2)
# Criptografia do .pfx: wrangler secret put CERT_BLOB_SECRET [--env staging]
# ──────────────────────────────────────────────
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "siscr-storage"

# ──────────────────────────────────────────────
# Queues — Tarefas assíncronas (emails, relatórios)
# ──────────────────────────────────────────────
[[queues.producers]]
binding = "QUEUE_TASKS"
queue = "siscr-tasks-staging"

[[queues.consumers]]
queue = "siscr-tasks-staging"
max_batch_size = 10
max_batch_timeout = 30

# ──────────────────────────────────────────────
# Cron Triggers — Tarefas agendadas
# ──────────────────────────────────────────────
[triggers]
crons = [
  "0 6 * * *",   # 06:00 UTC diário — verificar vencimentos
  "0 3 * * *",   # 03:00 UTC diário — reconciliação Stripe (não cobra)
  "*/30 * * * *" # A cada 30 min — conciliação de pagamentos
]

# ──────────────────────────────────────────────
# Ambiente: staging (testes sem afetar produção)
# ──────────────────────────────────────────────
[env.staging]
name = "siscr-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://api-staging.siscr.com.br"
FRONTEND_URL = "https://staging.siscr.com.br"
ALLOWED_ORIGINS = "https://staging.siscr.com.br,https://staging.siscr-web.pages.dev,https://siscr-web.pages.dev,https://suporte-staging.siscr.com.br,http://localhost:5174"
NFE_DEV_MODE = "0"
NFE_QUOTA_MENSAL = "50"
EMAIL_FROM = "SISCR <noreply@siscr.com.br>"
SUPPORT_DESK_URL = "https://suporte-staging.siscr.com.br"
# Price IDs sandbox (mensal). Secrets STRIPE_PRICE_* sobrescrevem estas vars.
STRIPE_PRICE_BASICO = "price_1U59stJcxPm9Lx7vQkyftcVw"
STRIPE_PRICE_PRO = "price_1U59swJcxPm9Lx7vDOkPmykQ"
STRIPE_PRICE_ENTERPRISE = "price_1U59t0JcxPm9Lx7v0ADoOFfH"
# Nota: tenant identificado via ?tenant=slug ou header X-Tenant-Slug no staging

[[env.staging.d1_databases]]
binding = "DB_SHARED"
database_name = "siscr-shared-staging"
database_id = "20ed0f6a-54fd-41f4-8cf2-36032ef60da1"
migrations_dir = "../../packages/db/migrations/shared"

[[env.staging.kv_namespaces]]
binding = "KV_SESSIONS"
id = "7ebafa6b64e24c56abea57f8d0998c94"

[[env.staging.kv_namespaces]]
binding = "KV_TENANT_CACHE"
id = "1119412c979c4f4ba0e4b4c247720c93"

[[env.staging.r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "siscr-storage-staging"

[[env.staging.queues.producers]]
binding = "QUEUE_TASKS"
queue = "siscr-tasks-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.send_email]]
name = "EMAIL"

[[env.staging.durable_objects.bindings]]
name = "SUPPORT_TICKET_ROOMS"
class_name = "SupportTicketRoom"

# ──────────────────────────────────────────────
# Ambiente: production
# ──────────────────────────────────────────────
[env.production]
name = "siscr-api-production"

[env.production.vars]
ENVIRONMENT = "production"
APP_URL = "https://api.siscr.com.br"
FRONTEND_URL = "https://app.siscr.com.br"
ALLOWED_ORIGINS = "https://app.siscr.com.br,https://suporte.siscr.com.br"
NFE_DEV_MODE = "0"
EMAIL_FROM = "SISCR <noreply@siscr.com.br>"
SUPPORT_DESK_URL = "https://suporte.siscr.com.br"
# Subdomínio por tenant: {slug}.app.siscr.com.br — requer wildcard DNS *.app.siscr.com.br → Pages
TENANT_HOST_BASE = "app.siscr.com.br"

[[env.production.d1_databases]]
binding = "DB_SHARED"
database_name = "siscr-shared-production"
database_id = "PLACEHOLDER_PROD_SHARED_DB_ID"
migrations_dir = "../../packages/db/migrations/shared"

[[env.production.kv_namespaces]]
binding = "KV_SESSIONS"
id = "PLACEHOLDER_PROD_KV_SESSIONS_ID"

[[env.production.kv_namespaces]]
binding = "KV_TENANT_CACHE"
id = "PLACEHOLDER_PROD_KV_TENANT_CACHE_ID"

[[env.production.r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "siscr-storage-production"

[[env.production.queues.producers]]
binding = "QUEUE_TASKS"
queue = "siscr-tasks-production"

[env.production.ai]
binding = "AI"

[[env.production.send_email]]
name = "EMAIL"

[[env.production.durable_objects.bindings]]
name = "SUPPORT_TICKET_ROOMS"
class_name = "SupportTicketRoom"
